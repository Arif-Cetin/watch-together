<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Watch Together - VIP Cinema</title>
  
  <!-- PeerJS & İkonlar -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Giriş / Şifre Ekranı -->
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-card">
      <div class="house-icon-wrapper">
        <i class="fa-solid fa-house main-icon"></i>
      </div>
      <h2>Bizim Odamız</h2>
      <p>Aleyna & Kaptan için özel şifrelenmiş VIP sinema odası.</p>
      
      <div class="auth-field">
        <label>Kullanıcı Adın</label>
        <input type="text" id="usernameInput" placeholder="Örn: Aleyna, Kaptan..." maxlength="18" autocomplete="off" />
      </div>

      <div class="auth-field">
        <label>Oda Şifresi</label>
        <input type="password" id="pinInput" placeholder="Güvenlik anahtarını gir..." autocomplete="off" />
      </div>

      <span class="auth-error" id="authError">Girdiğin şifre hatalı!</span>
      <button id="btnUnlock">Odaya Katıl</button>
    </div>
  </div>

  <!-- Ana Sinema Sahnesi -->
  <div class="main-stage">
    
    <!-- Üst Başlık & Kontrol Çubuğu -->
    <div class="top-header">
      <div class="room-title">
        <div class="mini-logo">
          <i class="fa-solid fa-sparkles"></i>
        </div>
        <span>Watch Together <span class="room-vip-badge">VIP</span></span>
      </div>

      <div class="header-right">
        <!-- Katılımcı Rozeti & Kullanıcı Başına Ses Slider'ı -->
        <div class="status-badge" id="statusBadge" title="Katılımcılar ve Ses Seviyeleri">
          <div class="status-indicator" id="statusDot"></div>
          <span id="statusText">Oda: 1</span>
          <i class="fa-solid fa-chevron-down status-chevron"></i>

          <div class="user-list-dropdown" id="userDropdown">
            <div class="dropdown-header">
              <span>KATILIMCILAR (<span id="userCountSpan">1</span>)</span>
            </div>
            <div class="dropdown-users" id="dropdownUsersList"></div>
          </div>
        </div>

        <!-- Hızlı Tepkiler / Emoji Menüsü -->
        <div class="reaction-wrapper">
          <button class="header-icon-btn" id="btnReactionTrigger" title="Tepki Gönder">
            <i class="fa-solid fa-heart" style="color: var(--neon-purple-bright);"></i>
          </button>
          <div class="reaction-menu" id="reactionMenu">
            <span class="react-btn" data-emoji="❤️">❤️</span>
            <span class="react-btn" data-emoji="🍿">🍿</span>
            <span class="react-btn" data-emoji="😂">😂</span>
            <span class="react-btn" data-emoji="🔥">🔥</span>
            <span class="react-btn" data-emoji="✨">✨</span>
          </div>
        </div>

        <!-- Sohbet Butonu -->
        <button class="header-icon-btn mobile-toggle" id="btnToggleChat" title="Sohbeti Aç/Kapat">
          <i class="fa-solid fa-comments"></i>
        </button>
      </div>
    </div>

    <!-- Yayın Sahnesi -->
    <div class="screen-area" id="screenArea">
      
      <!-- Ekran Yayını Ses Ayarı (%0 - %200 Boost) -->
      <div class="screen-volume-bar" id="screenVolumeControl" style="display: none;">
        <i class="fa-solid fa-volume-high" style="color: var(--neon-green-bright); font-size: 13px;"></i>
        <input type="range" id="screenVolSlider" min="0" max="2" step="0.05" value="1" />
        <span class="screen-vol-val" id="screenVolText">%100</span>
      </div>

      <!-- Tarayıcı Sesi Otomatik Engellerse Açma Tuşu -->
      <button class="unmute-banner" id="btnUnmute">
        <i class="fa-solid fa-volume-xmark"></i> Sesi Açmak İçin Dokunun
      </button>

      <!-- Tam Ekran Butonu -->
      <button class="fullscreen-btn" id="btnFullscreen" title="Tam Ekran" style="display: none;">
        <i class="fa-solid fa-expand"></i>
      </button>

      <!-- Yüzen Neon Emojiler Katmanı -->
      <div class="floating-reactions-layer" id="reactionsLayer"></div>

      <!-- Bekleme Sahnesi -->
      <div class="screen-placeholder" id="placeholder">
        <div class="placeholder-glow">
          <i class="fa-solid fa-house-chimney-heart"></i>
        </div>
        <h3>Bizim Sinemamız</h3>
        <p>Alttaki butonla ekranını paylaştığında sinema burada başlayacak.</p>
      </div>

      <video id="sharedVideo" autoplay playsinline style="display: none;"></video>

      <!-- Kamera Izgarası -->
      <div class="camera-grid" id="cameraGrid"></div>
    </div>

    <!-- Alt Buton Dock'u -->
    <div class="call-dock">
      <button class="dock-btn" id="btnMic" title="Mikrofon Aç/Kapat"><i class="fa-solid fa-microphone-slash"></i></button>
      <button class="dock-btn" id="btnCam" title="Kamera Aç/Kapat"><i class="fa-solid fa-video-slash"></i></button>
      <button class="dock-btn" id="btnShareScreen" title="Ekran Paylaşımı Başlat"><i class="fa-solid fa-desktop"></i></button>
      <button class="dock-btn danger" id="btnDisconnect" title="Odadan Ayrıl"><i class="fa-solid fa-phone-slash"></i></button>
    </div>
  </div>

  <!-- Sağ Sohbet Paneli -->
  <div class="chat-sidebar" id="chatSidebar">
    <div class="chat-header">
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <span># sinema-sohbet</span>
        <span class="current-user-tag" id="currentUserTag"></span>
      </div>
      <button class="close-chat-btn" id="btnCloseChat" title="Kapat">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="chat-scroller" id="chatList"></div>

    <!-- Yazıyor... Göstergesi -->
    <div class="typing-indicator" id="typingIndicator" style="display: none;">
      <span id="typingUser">Aleyna</span> yazıyor<span class="dots">...</span>
    </div>

    <div class="chat-bottom">
      <div class="chat-box">
        <input type="text" id="chatInput" placeholder="#sinema-sohbet kanalına yaz..." autocomplete="off" />
      </div>
    </div>
  </div>

  <div id="remoteAudiosContainer" style="display:none;"></div>

  <script src="app.js"></script>
</body>
</html>
